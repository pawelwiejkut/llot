name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: pytest --cov --cov-report=term-missing
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - name: Start LLOT (no Ollama/TTS backends; tests that need them skip themselves)
        run: |
          gunicorn -b 127.0.0.1:8080 -w 1 --threads 4 wsgi:app &
          timeout 30 sh -c 'until curl -fs http://127.0.0.1:8080/ >/dev/null; do sleep 1; done'
      - name: Browser tests
        run: pytest -m e2e
        env:
          LLOT_URL: http://127.0.0.1:8080

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
