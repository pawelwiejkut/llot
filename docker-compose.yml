# LLOT with an existing Ollama server (and optional Wyoming TTS server).
# Configure everything in .env (see .env.example), then: docker compose up -d

services:
  llot:
    build: .
    # Locally built image by default; set LLOT_IMAGE=ghcr.io/pawelwiejkut/llot:latest
    # and run `docker compose pull && docker compose up -d --no-build` to use a published image
    image: ${LLOT_IMAGE:-llot:latest}
    container_name: llot
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OL_MODEL=${OL_MODEL:-gemma4:26b}
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
