# Standalone setup with included Ollama
# Use this if you don't have Ollama installed on your host

services:
  llot:
    build: .
    container_name: llot
    ports:
      - "8080:8080"
    environment:
      # All .env variables - customize as needed
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - OL_MODEL=${OL_MODEL:-gemma4:26b}
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
      - WYOMING_TTS_HOST=${WYOMING_TTS_HOST:-}
      - WYOMING_TTS_PORT=${WYOMING_TTS_PORT:-10200}
      - TRANSLATION_LANGUAGES=${TRANSLATION_LANGUAGES:-}
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - llot-network

  ollama:
    image: ollama/ollama:latest
    container_name: llot-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./models:/root/.ollama/models
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    networks:
      - llot-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # Uncomment for GPU support (NVIDIA)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

networks:
  llot-network:
    driver: bridge

volumes:
  ollama_data: