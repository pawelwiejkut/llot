# Complete setup with Ollama + Wyoming Piper TTS
# Use this for a fully self-contained installation

services:
  llot:
    build: .
    container_name: llot
    ports:
      - "8080:8080"
    environment:
      # Ollama configuration (local container)
      - OLLAMA_HOST=http://ollama:11434
      - OL_MODEL=${OL_MODEL:-gemma4:26b}
      
      # Wyoming Piper TTS configuration (local container)
      - WYOMING_TTS_HOST=piper
      - WYOMING_TTS_PORT=10200
      # Piper offers several voices per language; pin the preferred ones
      - WYOMING_TTS_VOICES=${WYOMING_TTS_VOICES:-en=en_US-lessac-medium,de=de_DE-thorsten-medium,pl=pl_PL-gosia-medium}
      
      # Application settings
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
      
      # Optional: Limit available languages  
      - TRANSLATION_LANGUAGES=${TRANSLATION_LANGUAGES:-}
    depends_on:
      ollama:
        condition: service_healthy
      piper:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - llot-network

  ollama:
    image: ollama/ollama:latest
    container_name: llot-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./models:/root/.ollama/models
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    networks:
      - llot-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # Uncomment for NVIDIA GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  piper:
    image: rhasspy/wyoming-piper:latest
    container_name: llot-piper
    ports:
      - "10200:10200"
    volumes:
      - piper_data:/data
    # Default voice; other voices are downloaded on demand when first requested
    command: --voice en_US-lessac-medium --download-dir /data
    restart: unless-stopped
    networks:
      - llot-network
    # The image ships its own Wyoming healthcheck

networks:
  llot-network:
    driver: bridge

volumes:
  ollama_data:
  piper_data: